# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : les homes sont alors lus et écrits
# dans la base partagée (table shhomes_homes, une ligne par home) au lieu des fichiers data/<uuid>.json, chargés à
# l'arrivée du joueur une fois sa sauvegarde terminée sur l'autre serveur. Sans SHNetwork, rien de ceci n'est utilisé.
# Demande un redémarrage. Les fichiers existants sont repris avec /shhomes import.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de lire ses homes
  attente-max-secondes: 10
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shhomes
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # laisse le joueur sans accès à ses homes (message de chargement), la lecture est réessayée toutes les 10 secondes.
    delai-ms: 3000
