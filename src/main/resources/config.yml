# ======================================================================== #
# SHHomes
#
# Plugin : homes sur l'île du joueur (remplace EasyHome, reprend ses données). Un home doit se trouver sur l'île
# de son propriétaire. Avec SHNetwork, les homes sont rangés dans une base partagée et suivent le joueur d'un
# serveur à l'autre (voir la section 'reseau' en bas du fichier).
#
# Commandes :
#   /home [id]               Menu des homes, ou téléportation au home <id> (alias : /homes).
#   /home view <joueur>      Menu des homes d'un joueur connecté (staff).
#   /sethome [id]            Place un home à votre position.
#   /delhome <id>            Supprime un home.
#   /shhomes reload          Recharge config.yml et messages.yml (le bloc reseau demande un redémarrage). Un fichier
#                            invalide annule le rechargement. Les homes ne sont jamais touchés.
#   /shhomes import          Mode réseau : reprend en base les fichiers data/<uuid>.json de ce serveur (une fois).
#   /shhomes list <joueur>   Liste les homes d'un joueur, connecté ou non (pseudo exact).
#
# Permissions :
#   shhomes.home, shhomes.sethome, shhomes.delhome   Utiliser les commandes de même nom.
#   shhomes.group.<groupe>   Limites du groupe (section 'groups') : nombre de homes et délai entre deux téléportations.
#                            Un nœud par clé de 'groups', par exemple shhomes.group.vip, shhomes.group.vip+ ou
#                            shhomes.group.vipelite.
#   shhomes.admin            Toutes les permissions d'administration ci-dessous (op par défaut).
#   shhomes.admin.view       /home view <joueur>.
#   shhomes.admin.tp         Se téléporter au home d'un joueur depuis son menu.
#   shhomes.admin.delete     Supprimer le home d'un joueur depuis son menu.
#   shhomes.admin.import     /shhomes import.
#   shhomes.admin.reload     /shhomes reload.
#   shhomes.admin.list       /shhomes list <joueur>.
#
# Les textes des messages sont dans messages.yml, ceux des fenêtres dans 'dialogues'.
#
# ======================================================================== #

# Effet Cécité tant qu'un dialogue de ce plugin est affiché : le texte se lit sur fond noir. Il est retiré dès que le joueur
# clique un bouton du dialogue (ou Échap quand il a un bouton en bas), sinon dès qu'il tourne la caméra, se déplace ou ouvre un inventaire.
# Un joueur déjà aveugle pour une autre raison n'est pas touché.
aveugler-pendant-dialogues: true

settings:
  teleportSound: "ENTITY_ENDERMAN_TELEPORT"
  clickSound: "UI_BUTTON_CLICK"
  cancelWord: "annuler"

# Saisies par dialogue natif Minecraft (clients 1.21.6 et plus) : nom d'un home, ID d'un home, confirmation de suppression.
# Les clients plus anciens, ou actif: false, gardent la saisie dans le chat (mot « annuler ») et le menu de confirmation.
# Chaque texte accepte les codes & ; %home% = nom du home, %id% = son ID, %joueur% = son propriétaire, %max% = longueur maximale.
dialogues:
  actif: true
  # Version de protocole minimale du client pour recevoir un dialogue (771 = 1.21.6).
  # Sans ViaVersion sur le serveur, tous les clients ont la version du serveur et reçoivent le dialogue.
  min-protocol: 771
  # Durée de validité d'une fenêtre ouverte, en secondes : au-delà, le clic est refusé.
  expiration: 600
  boutons:
    valider: "&a&lValider"
    annuler: "&c&lAnnuler"
  nom:
    titre: "&e&lNom du Home"
    corps:
      - "&7Home &e%id%&7 : %home%&r"
      - "&7Ce nom apparaît dans le menu des homes. Vous pouvez y inclure des &bcodes couleurs&7."
    champ: "&fNouveau nom"
    # nombre maximal de caractères (codes couleurs compris), comme un message du chat
    longueur-max: 256
  id:
    titre: "&e&lID du Home"
    corps:
      - "&7Home actuel : %home%&r &8(&e%id%&8)"
      - "&7L'ID permet de s'y téléporter plus vite avec &e/home <id>&7. Un seul mot, sans espace."
    champ: "&fNouvel ID"
    longueur-max: 256
  suppression:
    titre: "&c&lSupprimer le Home ?"
    corps:
      - "&7Home : %home%&r &8(&e%id%&8)"
      - "&4Action irréversible."
    # variante affichée au staff qui supprime le home d'un autre joueur
    corps-admin:
      - "&7Home : %home%&r &8(&e%id%&8)"
      - "&7Joueur : &a%joueur%"
      - "&4Action irréversible."
    oui: "&c&lSupprimer le Home"
    non: "&a&lNe pas supprimer"
  # Erreurs affichées en rouge en tête de la fenêtre, qui se rouvre avec le texte déjà saisi
  erreurs:
    nom-vide: "&cLe nom ne peut pas être vide."
    nom-trop-long: "&cCe nom est trop long : %max% caractères maximum."
    nom-caracteres: "&cCe nom contient des caractères non autorisés."
    id-vide: "&cL'ID ne peut pas être vide."
    id-trop-long: "&cCet ID est trop long : %max% caractères maximum."
    id-caracteres: "&cCet ID contient des caractères non autorisés."
    id-utilise: "&cCet ID est déjà utilisé pour un autre Home."
  messages:
    expire: "&7&l« &e&lSH &8&l» &7Cette fenêtre a &eexpiré&7, recommencez l'action."
    erreur: "&7&l« &c&lSH &8&l» &7Une &cerreur &7est survenue, recommencez l'action."

groups:
  default: #valeur par défaut si le joueur n'appartient à aucun des groupes ci-contre
    cooldown: 180
    maxHomes: 3
  vip: #la permission sera donc shhomes.group.vip
    cooldown: 120
    maxHomes: 8
  vip+: #la permission sera donc shhomes.group.vip+
    cooldown: 60
    maxHomes: 15
  vipelite: #la permission sera donc shhomes.group.vipelite
    cooldown: 30
    maxHomes: 20

