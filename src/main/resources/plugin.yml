name: SHHomes
version: '${project.version}'
main: org.Cry_Legende.sHHomes.SHHomes
api-version: '1.21'
author: Cry_Legende
description: Homes sur l'île du joueur (remplace EasyHome, reprend ses données)
depend: [ SuperiorSkyblock2 ]
# SHNetwork est facultatif : sans lui, les homes restent dans les fichiers de ce serveur comme avant.
softdepend: [ ViaVersion, SHNetwork ]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (homes en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  home:
    description: Menu des homes, /home <id>, /home view <joueur>
    permission: shhomes.home
    usage: /<command>
    aliases: [ homes ]
  sethome:
    description: Place un home à votre position
    permission: shhomes.sethome
    usage: /<command> [id]
  delhome:
    description: Supprime un home
    permission: shhomes.delhome
    usage: /<command> <id>
  shhomes:
    description: Administration des homes
    usage: /<command> <reload|import|list>

permissions:
  shhomes.*:
    description: Toutes les permissions de SHHomes
    default: op
    children:
      shhomes.home: true
      shhomes.sethome: true
      shhomes.delhome: true
      shhomes.admin: true
  shhomes.home:
    description: Utiliser /home
    default: false
  shhomes.sethome:
    description: Utiliser /sethome
    default: false
  shhomes.delhome:
    description: Utiliser /delhome
    default: false
  # shhomes.group.<clé de groups> est géré dynamiquement : un nœud par groupe du config.yml (limites du groupe).
  shhomes.group.vip:
    description: "Limites du groupe « vip » (groups.vip) : nombre de homes et délai entre deux téléportations"
    default: op
  shhomes.group.vip+:
    description: Limites du groupe « vip+ » (groups.vip+)
    default: op
  shhomes.group.vipelite:
    description: Limites du groupe « vipelite » (groups.vipelite)
    default: op
  shhomes.admin:
    description: Toutes les permissions d'administration de SHHomes
    default: op
    children:
      shhomes.admin.view: true
      shhomes.admin.tp: true
      shhomes.admin.delete: true
      shhomes.admin.import: true
      shhomes.admin.reload: true
      shhomes.admin.list: true
  shhomes.admin.view:
    description: /home view <joueur>, menu des homes d'un joueur connecté
    default: false
  shhomes.admin.tp:
    description: Se téléporter au home d'un joueur depuis son menu
    default: false
  shhomes.admin.delete:
    description: Supprimer le home d'un joueur depuis son menu
    default: false
  shhomes.admin.import:
    description: /shhomes import, reprise des fichiers de homes en base (mode réseau)
    default: false
  shhomes.admin.reload:
    description: /shhomes reload, recharger config.yml et messages.yml
    default: false
  shhomes.admin.list:
    description: /shhomes list <joueur>, liste des homes d'un joueur
    default: false
